# A task record has deterministic facts plus explicitly semantic interpretation.
version: 1
record:
  mode: BUILD                         # deterministic
  initial_level: 0                    # deterministic
  final_level: 0                      # deterministic
  mechanical_floor: 0                 # deterministic
  escalated: false                    # deterministic
  mechanical_triggers: []             # deterministic trigger IDs
  trigger_events:                     # mandatory for every activation
    - trigger: string
      detected_by: path_match | command_or_tool_result
      evidence_ref: string
      minimum_level: 3
  trigger_disproof_events: []         # mandatory for any floor removal
  escalation_events: []               # mandatory for every level increase
  deescalation_events: []             # mandatory for every level decrease
  independent_review_required: false  # deterministic
  independent_review_completed: false # deterministic
  agents_spawned: []                  # deterministic
  skills_loaded: []                   # deterministic
  verification:
    tests_run: false
    commands: []
    evidence_refs: []
  files_changed: []                   # deterministic final change set

  # Semantic fields: Main's explicit interpretation, never trigger evidence.
  classification_reason: string
  complexity_assessment: string
  judgment_risks: []
  counterargument:
    possible_miss: string
    escalation_evidence: string
  review_findings: []
  remaining_uncertainty: []

event_contracts:
  trigger_disproof:
    required: [trigger, detected_by, evidence_ref, evidence_summary, disproved]
  escalation:
    required: [from_level, to_level, reason, evidence_ref]
  deescalation:
    required: [from_level, to_level, reason, evidence_ref, counterargument, mechanical_floor_changed]

