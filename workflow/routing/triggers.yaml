{
  "version": 2,
  "default_floor": 0,
  "triggers": [
    {
      "id": "authentication_sensitive",
      "source": "path",
      "patterns": ["**/auth/**", "**/auth.*", "**/authentication/**", "**/authentication.*", "**/authorization/**", "**/authorization.*", "**/permissions/**", "**/permissions.*", "**/rbac/**", "**/rbac.*", "**/guards/**", "**/guards.*", "**/session/**", "**/session.*", "**/sessions/**", "**/sessions.*", "**/jwt/**", "**/jwt.*", "**/oauth/**", "**/oauth.*", "**/passport/**", "**/passport.*"],
      "minimum_level": 3,
      "rationale": "sensitive_access_control_change"
    },
    {
      "id": "secrets_or_security_configuration",
      "source": "path",
      "patterns": ["**/.env*", "**/secrets/**", "**/secrets.*", "**/credentials/**", "**/credentials.*", "**/security/**", "**/security.*"],
      "minimum_level": 3,
      "rationale": "sensitive_configuration_change"
    },
    {
      "id": "database_migration",
      "source": "path",
      "patterns": ["**/migrations/**", "**/migration/**", "**/alembic/versions/**", "**/supabase/migrations/**"],
      "minimum_level": 3,
      "rationale": "persistence_contract_change"
    },
    {
      "id": "database_schema",
      "source": "path",
      "patterns": ["**/prisma/schema.prisma", "**/db/schema.*", "**/db/**/schema.*"],
      "minimum_level": 3,
      "rationale": "persistence_contract_change"
    },
    {
      "id": "dependency_or_lockfile",
      "source": "path",
      "patterns": ["**/package.json", "**/package-lock.json", "**/pnpm-lock.yaml", "**/yarn.lock", "**/pyproject.toml", "**/poetry.lock", "**/requirements*.txt", "**/Cargo.toml", "**/Cargo.lock", "**/go.mod", "**/go.sum"],
      "minimum_level": 3,
      "rationale": "supply_chain_or_runtime_change"
    },
    {
      "id": "production_or_infrastructure",
      "source": "path",
      "patterns": ["**/infra/**", "**/infrastructure/**", "**/terraform/**", "**/*.tf", "**/k8s/**", "**/helm/**", "**/deploy/**", "**/deployment/**", "**/production/**", "**/production.*", "**/*.production.*"],
      "minimum_level": 3,
      "rationale": "production_resource_change"
    },
    {
      "id": "public_api_or_protocol",
      "source": "path",
      "patterns": ["**/openapi/**", "**/openapi.*", "**/swagger/**", "**/swagger.*", "**/*.proto", "**/graphql/schema.*", "**/api-contracts/**"],
      "minimum_level": 3,
      "rationale": "public_interface_change"
    },
    {
      "id": "destructive_operation",
      "source": "command",
      "signatures": ["rm_recursive_force", "git_push_force", "terraform_destroy", "kubectl_delete", "sql_drop_table", "sql_truncate_table", "powershell_remove_item", "powershell_destructive_storage"],
      "minimum_level": 3,
      "rationale": "destructive_or_external_state_operation"
    },
    {
      "id": "shell_evaluated_command",
      "source": "command",
      "signatures": ["shell_evaluated_command"],
      "minimum_level": 3,
      "rationale": "cannot_deterministically_inspect_shell_evaluation"
    },
    {
      "id": "production_sensitive_operation",
      "source": "command",
      "signatures": ["terraform_apply", "kubectl_apply", "helm_upgrade"],
      "minimum_level": 3,
      "rationale": "production_sensitive_operation"
    }
  ]
}
